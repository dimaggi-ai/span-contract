name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Test suite, including the mutation tests
        run: PYTHONPATH=src:validation python -m pytest tests/ -q
      - name: Validation registry, and what it declines
        run: python validation/validate_contract.py
      - name: Every example envelope reaches its documented verdict
        run: python examples/run_examples.py
      - name: The installed console script works
        run: |
          spancontract --version
          spancontract example > /tmp/example.json
          spancontract validate /tmp/example.json || test $? -eq 1
